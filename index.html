<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff7aa5">
  <title>宝宝期消消乐</title>
  <style>
    :root {
      --pink: #ff4f87;
      --cyan: #00a9c7;
      --violet: #8657e8;
      --ink: #513a58;
      --cream: #fff9fb;
      --gap: clamp(4px, .8vw, 8px);
      --page-pad-top: max(18px, env(safe-area-inset-top));
      --page-pad-right: max(12px, env(safe-area-inset-right));
      --page-pad-bottom: max(28px, env(safe-area-inset-bottom));
      --page-pad-left: max(12px, env(safe-area-inset-left));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    html {
      min-height: 100dvh;
      overscroll-behavior: none;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      padding:
        var(--page-pad-top)
        var(--page-pad-right)
        var(--page-pad-bottom)
        var(--page-pad-left);
      touch-action: manipulation;
      overscroll-behavior: none;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 14%, rgba(255, 255, 255, .96) 0 4px, transparent 5px),
        radial-gradient(circle at 86% 22%, rgba(255, 255, 255, .82) 0 6px, transparent 7px),
        linear-gradient(145deg, #ffdbe7 0%, #fff6ed 48%, #e9e3ff 100%);
      background-size: 42px 42px, 64px 64px, auto;
    }

    button {
      font: inherit;
    }

    .game-shell {
      width: min(96vw, 660px);
      max-width: 100%;
      padding: clamp(15px, 3vw, 26px);
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 28px;
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 22px 55px rgba(112, 62, 99, .22);
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 5vw, 36px);
      letter-spacing: .04em;
      color: #e9437a;
      text-shadow: 0 2px 0 #fff;
    }

    .sound-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      flex: 0 0 auto;
      cursor: pointer;
      border: 0;
      border-radius: 50%;
      color: #7a527c;
      background: #fff;
      box-shadow: 0 5px 14px rgba(104, 63, 100, .15);
      transition: transform .18s ease;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 12px;
    }

    .stat {
      padding: 9px 6px;
      text-align: center;
      border-radius: 15px;
      background: rgba(255, 255, 255, .88);
      box-shadow: inset 0 0 0 1px rgba(255, 92, 139, .11);
    }

    .stat span {
      display: block;
      margin-bottom: 1px;
      font-size: 12px;
      color: #9b809d;
    }

    .stat strong {
      font-size: clamp(17px, 4vw, 23px);
      color: #674a6c;
    }

    .goals {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .goal {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      padding: 7px;
      border: 2px solid var(--goal-color);
      border-radius: 14px;
      background: #fff;
      transition: opacity .2s ease, transform .2s ease;
    }

    .goal.done {
      opacity: .58;
      transform: scale(.97);
    }

    .goal.done .goal-count::after {
      content: " ✓";
      color: #29ad73;
    }

    .goal-thumb {
      width: clamp(30px, 7vw, 40px);
      aspect-ratio: 1;
      flex: 0 0 auto;
      border-radius: 9px;
      object-fit: cover;
      object-position: center 30%;
    }

    .goal-count {
      min-width: 0;
      font-size: clamp(12px, 2.8vw, 15px);
      font-weight: 800;
      white-space: nowrap;
    }

    .board-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      margin: 0 auto;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      gap: var(--gap);
      width: min(100%, 608px);
      aspect-ratio: 1;
      padding: clamp(7px, 1.5vw, 11px);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .78), rgba(255, 221, 236, .63));
      box-shadow:
        inset 0 0 18px rgba(255, 255, 255, .88),
        0 13px 26px rgba(114, 74, 111, .17);
    }

    .tile {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      aspect-ratio: 1;
      padding: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      border: 3px solid var(--tile-color);
      border-radius: clamp(10px, 2vw, 15px);
      background: #fff;
      box-shadow:
        0 3px 0 color-mix(in srgb, var(--tile-color), #5a3757 23%),
        0 5px 9px rgba(67, 42, 63, .14);
      transition: transform .14s ease, filter .14s ease, opacity .18s ease;
    }

    .tile:active {
      cursor: grabbing;
    }

    .tile img {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
      object-fit: cover;
      object-position: center 28%;
    }

    .tile.type-1 img {
      object-position: center 42%;
    }

    .tile.type-2 img {
      object-position: center 37%;
    }

    .tile.selected {
      z-index: 2;
      transform: scale(.88);
      filter: brightness(1.08);
      box-shadow:
        0 0 0 4px #fff,
        0 0 0 7px var(--tile-color),
        0 8px 18px rgba(64, 39, 62, .24);
    }

    .tile.dragging {
      z-index: 3;
      transform: scale(1.11) rotate(-2deg);
      filter: brightness(1.07);
    }

    .tile.matched {
      pointer-events: none;
      animation: pop-out .3s forwards;
    }

    .tile.bad-swap {
      animation: shake .28s;
    }

    @keyframes pop-out {
      0% { transform: scale(1); opacity: 1; }
      55% { transform: scale(1.17) rotate(5deg); opacity: .8; }
      100% { transform: scale(.15) rotate(-12deg); opacity: 0; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .board-mask {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
      border-radius: 22px;
      background: rgba(255, 255, 255, .46);
      transition: opacity .2s;
    }

    .board-mask.show {
      opacity: 1;
    }

    .board-mask span {
      padding: 9px 16px;
      border-radius: 99px;
      color: #fff;
      font-weight: 800;
      background: #7c5bc2;
      box-shadow: 0 7px 20px rgba(80, 57, 117, .25);
    }

    .tip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 13px;
    }

    .tip {
      margin: 0;
      font-size: clamp(12px, 2.7vw, 14px);
      color: #876d89;
    }

    .restart-btn,
    .modal-btn {
      cursor: pointer;
      border: 0;
      border-radius: 999px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #ff5b8f, #9a5be8);
      box-shadow: 0 7px 16px rgba(168, 65, 125, .24);
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .restart-btn {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 10px 16px;
      font-size: 13px;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: max(22px, calc(env(safe-area-inset-top) + 8px));
      z-index: 20;
      max-width: min(88vw, 460px);
      padding: 10px 18px;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -18px);
      border-radius: 999px;
      color: #fff;
      font-weight: 800;
      text-align: center;
      background: rgba(91, 59, 96, .92);
      box-shadow: 0 9px 25px rgba(60, 38, 60, .22);
      transition: .25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      visibility: hidden;
      opacity: 0;
      background: rgba(63, 36, 65, .42);
      backdrop-filter: blur(7px);
      transition: opacity .22s ease, visibility .22s ease;
    }

    .modal.show {
      visibility: visible;
      opacity: 1;
    }

    .modal-card {
      width: min(92vw, 420px);
      padding: 28px 24px 25px;
      text-align: center;
      border: 2px solid #fff;
      border-radius: 28px;
      background: linear-gradient(145deg, #fff, #fff0f6);
      box-shadow: 0 25px 65px rgba(65, 37, 65, .28);
      transform: scale(.84);
      transition: transform .3s cubic-bezier(.2, .9, .3, 1.25);
    }

    .modal.show .modal-card {
      transform: scale(1);
    }

    .modal-icon {
      margin-bottom: 4px;
      font-size: 54px;
    }

    .modal-card h2 {
      margin: 3px 0 7px;
      font-size: 29px;
      color: #e6497b;
    }

    .modal-card p {
      margin: 0 0 19px;
      line-height: 1.7;
      color: #806783;
    }

    .modal-btn {
      min-height: 46px;
      min-width: 145px;
      padding: 12px 25px;
    }

    .confetti {
      position: fixed;
      top: -25px;
      z-index: 31;
      width: 10px;
      height: 17px;
      pointer-events: none;
      animation: confetti-fall 2.6s linear forwards;
    }

    @keyframes confetti-fall {
      to {
        transform: translate3d(var(--drift), 110vh, 0) rotate(720deg);
        opacity: .2;
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .sound-btn:hover {
        transform: scale(1.07);
      }

      .tile:hover {
        transform: translateY(-2px);
        filter: brightness(1.04);
      }

      .restart-btn:hover,
      .modal-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(168, 65, 125, .3);
      }
    }

    @media (max-width: 520px) {
      :root {
        --gap: clamp(3px, .9vw, 5px);
        --page-pad-top: max(6px, env(safe-area-inset-top));
        --page-pad-right: max(4px, env(safe-area-inset-right));
        --page-pad-bottom: max(8px, env(safe-area-inset-bottom));
        --page-pad-left: max(4px, env(safe-area-inset-left));
      }

      body {
        place-items: start center;
        background-size: 34px 34px, 52px 52px, auto;
      }

      .game-shell {
        width: 100%;
        padding: 10px 6px 11px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(112, 62, 99, .17);
      }

      .title-row {
        padding-inline: 4px;
        margin-bottom: 7px;
      }

      h1 {
        font-size: clamp(21px, 7vw, 29px);
        letter-spacing: 0;
      }

      .sound-btn {
        width: 44px;
        height: 44px;
      }

      .stats {
        gap: 5px;
        margin-bottom: 7px;
      }

      .stat {
        padding: 5px 3px;
        border-radius: 11px;
      }

      .stat span {
        font-size: 10px;
      }

      .stat strong {
        font-size: clamp(16px, 5vw, 20px);
      }

      .goals {
        gap: 4px;
        margin-bottom: 7px;
      }

      .goal {
        justify-content: center;
        gap: 3px;
        padding: 4px 2px;
        border-width: 2px;
        border-radius: 10px;
      }

      .goal-thumb {
        width: clamp(26px, 8vw, 34px);
        border-radius: 7px;
      }

      .goal-count {
        font-size: clamp(10px, 3.2vw, 13px);
      }

      #board {
        width: 100%;
        padding: clamp(4px, 1.5vw, 7px);
        border-radius: 14px;
      }

      .tile {
        border-width: 2px;
        border-radius: clamp(6px, 2.2vw, 10px);
        box-shadow:
          0 2px 0 color-mix(in srgb, var(--tile-color), #5a3757 23%),
          0 3px 5px rgba(67, 42, 63, .13);
      }

      .tip-row {
        align-items: center;
        gap: 7px;
        margin-top: 8px;
        padding-inline: 3px;
      }

      .tip {
        font-size: clamp(10px, 3vw, 13px);
        line-height: 1.35;
      }

      .restart-btn {
        min-width: 88px;
        padding-inline: 12px;
      }

      .modal-card {
        padding: 23px 18px 21px;
        border-radius: 23px;
      }

      .modal-icon {
        font-size: 47px;
      }

      .modal-card h2 {
        font-size: 25px;
      }
    }

    @media (max-width: 340px) {
      .game-shell {
        padding-inline: 3px;
      }

      h1 {
        font-size: 20px;
      }

      .sound-btn {
        width: 40px;
        height: 40px;
        min-width: 40px;
        min-height: 40px;
      }

      .goal-thumb {
        width: 24px;
      }

      .goal-count {
        font-size: 9px;
      }

      .tip {
        max-width: 64%;
      }

      .restart-btn {
        min-width: 84px;
        min-height: 42px;
        padding: 8px 10px;
      }
    }

    @media (orientation: landscape) and (max-height: 620px) and (min-width: 680px) {
      :root {
        --page-pad-top: max(6px, env(safe-area-inset-top));
        --page-pad-right: max(8px, env(safe-area-inset-right));
        --page-pad-bottom: max(6px, env(safe-area-inset-bottom));
        --page-pad-left: max(8px, env(safe-area-inset-left));
        --gap: clamp(3px, .7vh, 6px);
      }

      body {
        place-items: center;
      }

      .game-shell {
        display: grid;
        grid-template-columns: minmax(280px, calc(100vh - 28px)) minmax(250px, 1fr);
        grid-template-columns: minmax(280px, calc(100dvh - 28px)) minmax(250px, 1fr);
        grid-template-areas:
          "board title"
          "board stats"
          "board goals"
          "board tip";
        align-items: center;
        gap: 8px 18px;
        width: min(98vw, 980px);
        padding: 8px 14px;
        border-radius: 20px;
      }

      .title-row {
        grid-area: title;
        margin: 0;
      }

      h1 {
        font-size: clamp(22px, 4.5vh, 30px);
      }

      .stats {
        grid-area: stats;
        gap: 5px;
        margin: 0;
      }

      .stat {
        padding: 5px 3px;
      }

      .goals {
        grid-area: goals;
        grid-template-columns: 1fr;
        gap: 5px;
        margin: 0;
      }

      .goal {
        padding: 4px 7px;
      }

      .goal-thumb {
        width: clamp(27px, 6.5vh, 36px);
      }

      .board-wrap {
        grid-area: board;
        width: min(100%, calc(100dvh - 42px));
      }

      #board {
        width: 100%;
        padding: clamp(5px, 1vh, 8px);
      }

      .tip-row {
        grid-area: tip;
        align-items: center;
        margin: 0;
      }

      .tip {
        font-size: 12px;
      }

      .restart-btn {
        min-height: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <div class="title-row">
      <h1>🍬 宝宝期消消乐</h1>
      <button id="soundBtn" class="sound-btn" type="button" title="开关音效" aria-label="开关音效">🔊</button>
    </div>

    <section class="stats" aria-label="游戏状态">
      <div class="stat"><span>关卡</span><strong id="levelText">1 / 3</strong></div>
      <div class="stat"><span>剩余步数</span><strong id="movesText">20</strong></div>
      <div class="stat"><span>得分</span><strong id="scoreText">0</strong></div>
    </section>

    <section id="goals" class="goals" aria-label="过关目标"></section>

    <div class="board-wrap">
      <div id="board" role="grid" aria-label="消消乐棋盘"></div>
      <div id="boardMask" class="board-mask"><span>正在重排...</span></div>
    </div>

    <div class="tip-row">
      <p class="tip">拖动图案与相邻格交换，横向或纵向连成 3 个即可消除。</p>
      <button id="restartBtn" class="restart-btn" type="button">重新开始</button>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div id="modalIcon" class="modal-icon">🎉</div>
      <h2 id="modalTitle">成功过关</h2>
      <p id="modalMessage"></p>
      <button id="modalBtn" class="modal-btn" type="button">下一关</button>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const ROWS = 8;
      const COLS = 8;
      const TILE_TYPES = 3;
      const MAX_CHAIN = 6;
      const LEVELS = [
        { moves: 20, goals: [18, 18, 18] },
        { moves: 22, goals: [28, 28, 28] },
        { moves: 24, goals: [40, 40, 40] }
      ];
      const TILE_DATA = [
        {

      const boardEl = document.getElementById("board");
      const goalsEl = document.getElementById("goals");
      const levelText = document.getElementById("levelText");
      const movesText = document.getElementById("movesText");
      const scoreText = document.getElementById("scoreText");
      const toastEl = document.getElementById("toast");
      const modalEl = document.getElementById("modal");
      const modalIcon = document.getElementById("modalIcon");
      const modalTitle = document.getElementById("modalTitle");
      const modalMessage = document.getElementById("modalMessage");
      const modalBtn = document.getElementById("modalBtn");
      const restartBtn = document.getElementById("restartBtn");
      const soundBtn = document.getElementById("soundBtn");
      const boardMask = document.getElementById("boardMask");

      let board = [];
      let level = 0;
      let moves = 0;
      let score = 0;
      let collected = [0, 0, 0];
      let busy = false;
      let gameOver = false;
      let selectedIndex = null;
      let dragState = null;
      let soundEnabled = true;
      let toastTimer = null;
      let audioContext = null;

      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
      const randomType = () => Math.floor(Math.random() * TILE_TYPES);
      const rowOf = index => Math.floor(index / COLS);
      const colOf = index => index % COLS;
      const indexOf = (row, col) => row * COLS + col;
      const isInside = (row, col) => row >= 0 && row < ROWS && col >= 0 && col < COLS;

      function startLevel(levelIndex) {
        level = levelIndex;
        const config = LEVELS[level];
        moves = config.moves;
        score = 0;
        collected = [0, 0, 0];
        busy = false;
        gameOver = false;
        selectedIndex = null;
        modalEl.classList.remove("show");
        board = createPlayableBoard();
        renderGoals();
        renderBoard();
        updateHud();
        showToast(`第 ${level + 1} 关开始，加油！`);
      }

      function createPlayableBoard() {
        let result;
        let attempts = 0;

        do {
          result = new Array(ROWS * COLS);
          for (let row = 0; row < ROWS; row++) {
            for (let col = 0; col < COLS; col++) {
              const blocked = new Set();
              if (col >= 2 && result[indexOf(row, col - 1)] === result[indexOf(row, col - 2)]) {
                blocked.add(result[indexOf(row, col - 1)]);
              }
              if (row >= 2 && result[indexOf(row - 1, col)] === result[indexOf(row - 2, col)]) {
                blocked.add(result[indexOf(row - 1, col)]);
              }
              const choices = [0, 1, 2].filter(type => !blocked.has(type));
              result[indexOf(row, col)] = choices[Math.floor(Math.random() * choices.length)];
            }
          }
          attempts++;
        } while (!hasPossibleMove(result) && attempts < 100);

        return result;
      }

      function renderGoals() {
        const goals = LEVELS[level].goals;
        goalsEl.innerHTML = TILE_DATA.map((tile, type) => {
          const current = Math.min(collected[type], goals[type]);
          const done = current >= goals[type] ? "done" : "";
          return `
            <div class="goal ${done}" style="--goal-color:${tile.color}">
              <img class="goal-thumb" src="${tile.image}" alt="${tile.name}">
              <span class="goal-count">${current} / ${goals[type]}</span>
            </div>
          `;
        }).join("");
      }

      function renderBoard(matched = new Set(), badSwap = new Set()) {
        const fragment = document.createDocumentFragment();
        boardEl.innerHTML = "";

        board.forEach((type, index) => {
          if (type === null || type === undefined) {
            const empty = document.createElement("div");
            empty.setAttribute("aria-hidden", "true");
            fragment.appendChild(empty);
            return;
          }

          const tileInfo = TILE_DATA[type];
          const tile = document.createElement("button");
          tile.type = "button";
          tile.className = [
            "tile",
            `type-${type}`,
            selectedIndex === index ? "selected" : "",
            dragState?.index === index ? "dragging" : "",
            matched.has(index) ? "matched" : "",
            badSwap.has(index) ? "bad-swap" : ""
          ].filter(Boolean).join(" ");
          tile.dataset.index = index;
          tile.style.setProperty("--tile-color", tileInfo.color);
          tile.setAttribute("role", "gridcell");
          tile.setAttribute("aria-label", `${rowOf(index) + 1}行${colOf(index) + 1}列，${tileInfo.name}`);
          tile.innerHTML = `<img src="${tileInfo.image}" alt="" draggable="false">`;
          fragment.appendChild(tile);
        });

        boardEl.appendChild(fragment);
      }

      function updateHud() {
        levelText.textContent = `${level + 1} / ${LEVELS.length}`;
        movesText.textContent = moves;
        scoreText.textContent = score.toLocaleString("zh-CN");
        renderGoals();
      }

      function findMatches(source = board) {
        const matched = new Set();

        for (let row = 0; row < ROWS; row++) {
          let runStart = 0;
          for (let col = 1; col <= COLS; col++) {
            const current = col < COLS ? source[indexOf(row, col)] : Symbol("end");
            const previous = source[indexOf(row, col - 1)];
            if (current !== previous) {
              if (previous !== null && previous !== undefined && col - runStart >= 3) {
                for (let matchCol = runStart; matchCol < col; matchCol++) {
                  matched.add(indexOf(row, matchCol));
                }
              }
              runStart = col;
            }
          }
        }

        for (let col = 0; col < COLS; col++) {
          let runStart = 0;
          for (let row = 1; row <= ROWS; row++) {
            const current = row < ROWS ? source[indexOf(row, col)] : Symbol("end");
            const previous = source[indexOf(row - 1, col)];
            if (current !== previous) {
              if (previous !== null && previous !== undefined && row - runStart >= 3) {
                for (let matchRow = runStart; matchRow < row; matchRow++) {
                  matched.add(indexOf(matchRow, col));
                }
              }
              runStart = row;
            }
          }
        }

        return matched;
      }

      function swapIn(source, first, second) {
        [source[first], source[second]] = [source[second], source[first]];
      }

      function areAdjacent(first, second) {
        return Math.abs(rowOf(first) - rowOf(second)) + Math.abs(colOf(first) - colOf(second)) === 1;
      }

      async function attemptSwap(first, second) {
        if (busy || gameOver || first === second || !areAdjacent(first, second)) return;
        busy = true;
        selectedIndex = null;

        swapIn(board, first, second);
        renderBoard();
        await sleep(130);

        const matches = findMatches();
        if (matches.size === 0) {
          playTone("wrong");
          renderBoard(new Set(), new Set([first, second]));
          await sleep(270);
          swapIn(board, first, second);
          renderBoard();
          showToast("这一步没有形成三连，换个位置试试");
          busy = false;
          return;
        }

        moves--;
        updateHud();
        playTone("swap");
        await resolveMatches(matches);
        busy = false;
        await finishTurn();
      }

      async function resolveMatches(initialMatches) {
        let matches = initialMatches;
        let chain = 1;

        while (matches.size > 0) {
          const removedByType = [0, 0, 0];
          matches.forEach(index => {
            const type = board[index];
            if (type !== null && type !== undefined) removedByType[type]++;
          });

          removedByType.forEach((count, type) => {
            collected[type] += count;
          });
          score += matches.size * 60 * chain;
          updateHud();
          renderBoard(matches);
          playTone(chain > 1 ? "chain" : "match");
          if (chain > 1) showToast(`${chain} 连消！得分翻倍`);
          await sleep(300);

          matches.forEach(index => {
            board[index] = null;
          });
          collapseBoard();
          renderBoard();
          await sleep(180);

          refillBoard();
          renderBoard();
          await sleep(250);

          matches = findMatches();
          chain++;
          if (chain > MAX_CHAIN && matches.size > 0) {
            board = createPlayableBoard();
            renderBoard();
            showToast("超级连锁！棋盘已自动稳定");
            await sleep(250);
            matches = new Set();
          }
        }
      }

      function collapseBoard() {
        for (let col = 0; col < COLS; col++) {
          const values = [];
          for (let row = ROWS - 1; row >= 0; row--) {
            const value = board[indexOf(row, col)];
            if (value !== null && value !== undefined) values.push(value);
          }

          for (let row = ROWS - 1, offset = 0; row >= 0; row--, offset++) {
            board[indexOf(row, col)] = offset < values.length ? values[offset] : null;
          }
        }
      }

      function refillBoard() {
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            const current = indexOf(row, col);
            if (board[current] !== null && board[current] !== undefined) continue;

            const blocked = new Set();
            const blockPair = (rowA, colA, rowB, colB) => {
              if (!isInside(rowA, colA) || !isInside(rowB, colB)) return;
              const first = board[indexOf(rowA, colA)];
              const second = board[indexOf(rowB, colB)];
              if (first !== null && first !== undefined && first === second) blocked.add(first);
            };

            blockPair(row, col - 1, row, col - 2);
            blockPair(row, col + 1, row, col + 2);
            blockPair(row, col - 1, row, col + 1);
            blockPair(row - 1, col, row - 2, col);
            blockPair(row + 1, col, row + 2, col);
            blockPair(row - 1, col, row + 1, col);

            const choices = [0, 1, 2].filter(type => !blocked.has(type));
            board[current] = choices.length
              ? choices[Math.floor(Math.random() * choices.length)]
              : randomType();
          }
        }
      }

      function hasPossibleMove(source = board) {
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            const current = indexOf(row, col);
            const neighbors = [
              [row, col + 1],
              [row + 1, col]
            ];

            for (const [nextRow, nextCol] of neighbors) {
              if (!isInside(nextRow, nextCol)) continue;
              const next = indexOf(nextRow, nextCol);
              swapIn(source, current, next);
              const possible = findMatches(source).size > 0;
              swapIn(source, current, next);
              if (possible) return true;
            }
          }
        }
        return false;
      }

      async function finishTurn() {
        if (isLevelComplete()) {
          gameOver = true;
          playTone("win");
          launchConfetti();
          showResult(true);
          return;
        }

        if (moves <= 0) {
          gameOver = true;
          playTone("lose");
          showResult(false);
          return;
        }

        if (!hasPossibleMove()) {
          boardMask.classList.add("show");
          showToast("棋盘无解，正在自动重排");
          await sleep(700);
          board = createPlayableBoard();
          renderBoard();
          boardMask.classList.remove("show");
        }
      }

      function isLevelComplete() {
        return LEVELS[level].goals.every((goal, type) => collected[type] >= goal);
      }

      function showResult(won) {
        const finalLevel = won && level === LEVELS.length - 1;
        modalIcon.textContent = won ? (finalLevel ? "🏆" : "🎉") : "💗";
        modalTitle.textContent = won ? (finalLevel ? "全部通关！" : "成功过关！") : "差一点点";
        modalMessage.textContent = won
          ? (finalLevel
              ? `三关全部完成，最终得分 ${score.toLocaleString("zh-CN")}！你就是消除大师。`
              : `本关得分 ${score.toLocaleString("zh-CN")}，准备挑战第 ${level + 2} 关吧。`)
          : `步数已经用完，本关得到 ${score.toLocaleString("zh-CN")} 分，再试一次一定能过！`;
        modalBtn.textContent = won ? (finalLevel ? "从第一关再玩" : "下一关") : "重试本关";
        modalBtn.dataset.action = won ? (finalLevel ? "restart-all" : "next") : "retry";
        modalEl.classList.add("show");
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        toastEl.textContent = message;
        toastEl.classList.add("show");
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1700);
      }

      function launchConfetti() {
        const colors = ["#ff4f87", "#00a9c7", "#8657e8", "#ffd34e", "#59d18b"];
        for (let i = 0; i < 42; i++) {
          const piece = document.createElement("i");
          piece.className = "confetti";
          piece.style.left = `${Math.random() * 100}vw`;
          piece.style.background = colors[i % colors.length];
          piece.style.setProperty("--drift", `${Math.random() * 160 - 80}px`);
          piece.style.animationDelay = `${Math.random() * .55}s`;
          piece.style.transform = `rotate(${Math.random() * 180}deg)`;
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 3400);
        }
      }

      function playTone(kind) {
        if (!soundEnabled) return;
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          const settings = {
            swap: [420, .05],
            match: [600, .08],
            chain: [780, .1],
            wrong: [180, .09],
            win: [880, .22],
            lose: [230, .18]
          }[kind] || [500, .07];

          oscillator.type = kind === "wrong" || kind === "lose" ? "sawtooth" : "sine";
          oscillator.frequency.setValueAtTime(settings[0], audioContext.currentTime);
          if (kind === "win") {
            oscillator.frequency.exponentialRampToValueAtTime(1320, audioContext.currentTime + settings[1]);
          }
          gain.gain.setValueAtTime(.055, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + settings[1]);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + settings[1]);
        } catch (error) {
          soundEnabled = false;
          soundBtn.textContent = "🔇";
        }
      }

      function getTileIndex(target) {
        const tile = target.closest(".tile");
        return tile ? Number(tile.dataset.index) : null;
      }

      boardEl.addEventListener("pointerdown", event => {
        if (busy || gameOver) return;
        const index = getTileIndex(event.target);
        if (index === null) return;
        dragState = {
          index,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          moved: false
        };
        const tile = event.target.closest(".tile");
        tile.setPointerCapture?.(event.pointerId);
        tile.classList.add("dragging");
      });

      boardEl.addEventListener("pointermove", event => {
        if (!dragState || dragState.pointerId !== event.pointerId || busy) return;
        const dx = event.clientX - dragState.startX;
        const dy = event.clientY - dragState.startY;
        const threshold = Math.max(18, boardEl.clientWidth / COLS * .28);
        if (Math.max(Math.abs(dx), Math.abs(dy)) < threshold) return;

        const from = dragState.index;
        let targetRow = rowOf(from);
        let targetCol = colOf(from);
        if (Math.abs(dx) > Math.abs(dy)) {
          targetCol += dx > 0 ? 1 : -1;
        } else {
          targetRow += dy > 0 ? 1 : -1;
        }

        dragState.moved = true;
        dragState = null;
        renderBoard();
        if (isInside(targetRow, targetCol)) {
          attemptSwap(from, indexOf(targetRow, targetCol));
        }
      });

      boardEl.addEventListener("pointerup", event => {
        if (!dragState || dragState.pointerId !== event.pointerId || busy) return;
        const clicked = dragState.index;
        const wasMoved = dragState.moved;
        dragState = null;
        if (wasMoved) return;

        if (selectedIndex === null) {
          selectedIndex = clicked;
          playTone("swap");
          renderBoard();
          return;
        }

        if (selectedIndex === clicked) {
          selectedIndex = null;
          renderBoard();
          return;
        }

        if (areAdjacent(selectedIndex, clicked)) {
          const first = selectedIndex;
          selectedIndex = null;
          renderBoard();
          attemptSwap(first, clicked);
        } else {
          selectedIndex = clicked;
          showToast("请选择相邻的图案");
          renderBoard();
        }
      });

      boardEl.addEventListener("pointercancel", () => {
        dragState = null;
        renderBoard();
      });

      boardEl.addEventListener("contextmenu", event => event.preventDefault());

      restartBtn.addEventListener("click", () => {
        if (busy) return;
        startLevel(level);
      });

      modalBtn.addEventListener("click", () => {
        const action = modalBtn.dataset.action;
        if (action === "next") startLevel(level + 1);
        else if (action === "restart-all") startLevel(0);
        else startLevel(level);
      });

      soundBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? "🔊" : "🔇";
        soundBtn.setAttribute("aria-label", soundEnabled ? "关闭音效" : "开启音效");
        if (soundEnabled) playTone("swap");
      });

      startLevel(0);
    })();
  </script>
</body>
</html>
